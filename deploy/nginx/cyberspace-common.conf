# Shared by both CyberSpace entry points. Install as
# /etc/nginx/snippets/cyberspace-common.conf.

root /opt/cyberspace/web;

# Level file uploads are capped at 100 MiB by the API (plus form overhead).
client_max_body_size 102m;

location /api/ {
    include /etc/nginx/snippets/cyberspace-proxy.conf;
}

location /health/ {
    include /etc/nginx/snippets/cyberspace-proxy.conf;
}

# Vite fingerprints these file names, so they can be cached for good.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# Client-side routes all load the single-page app.
location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
}
