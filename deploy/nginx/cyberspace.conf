# CyberSpace: nginx in front of the Go API (127.0.0.1:8080) and the built
# client (/opt/cyberspace/web). Install as /etc/nginx/sites-available/cyberspace.
#
# The listener a request arrives on decides whether it may reach the student
# assessment API (/api/v1/student/):
#
#   127.0.0.1:8090        Cloudflare Tunnel: everyone outside the lab. Never
#                         allowed, whatever headers the request carries.
#   192.168.20.241:443    Direct LAN: lab PCs resolve cyberspace.skysec.org to
#                         this address. Allowed only from the lab subnet.
#
# Learning, sign-in and every admin page work on both.

# Cloudflare Tunnel entry point. cloudflared is the only client, and it
# reports the visitor's address in CF-Connecting-IP.
server {
    listen 127.0.0.1:8090;
    server_name cyberspace.skysec.org;

    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    # Let's Encrypt HTTP-01 challenges for the LAN certificate arrive here.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location /api/v1/student/ {
        default_type application/json;
        return 403 '{"code":"lab_only","message":"Assessments can only be taken from the CyberSpace lab."}';
    }

    include /etc/nginx/snippets/cyberspace-common.conf;
}

# Direct LAN entry point.
server {
    listen 192.168.20.241:80;
    server_name cyberspace.skysec.org;
    return 301 https://cyberspace.skysec.org$request_uri;
}

server {
    # Ubuntu 24.04's nginx 1.24 predates the separate "http2 on" directive.
    listen 192.168.20.241:443 ssl http2;
    server_name cyberspace.skysec.org;

    ssl_certificate     /etc/letsencrypt/live/cyberspace.skysec.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cyberspace.skysec.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /api/v1/student/ {
        allow 192.168.20.0/24;
        deny all;
        error_page 403 = @lab_only;
        include /etc/nginx/snippets/cyberspace-proxy.conf;
    }

    location @lab_only {
        default_type application/json;
        return 403 '{"code":"lab_only","message":"Assessments can only be taken from the CyberSpace lab."}';
    }

    include /etc/nginx/snippets/cyberspace-common.conf;
}
