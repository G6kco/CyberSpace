# Proxy to the Go API. Install as /etc/nginx/snippets/cyberspace-proxy.conf.
#
# The forwarding headers are overwritten, never appended to, so a client
# cannot plant an address the API would log. The API trusts them only from
# loopback.
proxy_pass http://127.0.0.1:8080;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_read_timeout 120s;
